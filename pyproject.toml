[project]
name = "kaggle-base"
version = "0.0.1"
description = "Home base for Kaggle ML problems and solutions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "scipy>=1.13",

    # Modeling baseline
    "scikit-learn>=1.5",

    # Plotting / EDA
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # Notebooks
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",

    # Misc utilities
    "tqdm>=4.66",
    "joblib>=1.4",

    # Kaggle CLI for downloading datasets / submitting
    "kaggle>=1.6",

    # Cloud storage (Cloudflare R2 via S3-compatible API).
    "s3fs>=2024.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Gradient-boosted trees (the workhorses for tabular Kaggle).
gbm = [
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
]
# Deep learning. Install separately if/when you need it -- torch is a heavy
# dependency and the right wheel depends on your CUDA / CPU choice.
dl = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "datasets>=3.0",
    "lightning>=2.4",
    "timm>=1.0",
]
# Experiment tracking (pick whichever you actually use).
tracking = [
    "mlflow>=2.16",
    "wandb>=0.18",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Makes `shared` importable from any competition notebook/script
# (after `uv sync` or `pip install -e .`).
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"**/notebooks/**" = ["E402", "F401", "F841"]  # notebooks get latitude
"**/*.ipynb" = ["E402", "F401", "F841"]
